<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MiniStock</title>
    <!-- Font & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        /* Background gradasi modern */
        background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-card {
        /* Glassmorphism Effect */
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        padding: 2.5rem;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.5);
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .brand {
        font-size: 26px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .brand i {
        color: #3b82f6;
        font-size: 32px;
      }
      input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 14px;
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
        transition: all 0.3s;
      }
      input:focus {
        outline: none;
        background-color: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }
      input:disabled {
        background-color: #e9ecef;
        cursor: not-allowed;
      }
      button {
        width: 100%;
        padding: 14px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        font-family: "Plus Jakarta Sans", sans-serif;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      button:hover {
        background-color: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      .footer-text {
        margin-top: 25px;
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand"><i class="ph-fill ph-package"></i> MiniStock</div>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">
          Masuk ke Sistem <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>
      <div class="footer-text">© 2026 MiniStock Inventory System</div>
    </div>

    <script>
      window.addEventListener("load", () => {
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        if (usernameInput) usernameInput.disabled = false;
        if (passwordInput) passwordInput.disabled = false;

        console.log("✅ Inputs enabled and ready");
      });
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            const data = await response.json();
            if (response.ok) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("role", data.role);
              localStorage.setItem("username", data.username || username);
              window.location.href = "dashboard.html";
            } else {
              alert("Login Gagal: " + data.message);
            }
          } catch (error) {
            console.error("Eror saat login:", error);
            alert("Tidak dapat terhubung ke server.");
          }
        });
    </script>
  </body>
</html>
